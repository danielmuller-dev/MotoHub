name: CI

on:
  push:
    branches:
      - main
      - master
      - "agent/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/motogestor?schema=public
      SESSION_SECRET: ci-session-secret-with-more-than-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run CI checks
        run: npm run ci

      - name: Audit production dependencies
        run: npm audit --omit=dev
